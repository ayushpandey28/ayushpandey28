<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ayush Pandey, Full Stack Developer</title>
  <desc id="desc">Profile banner with name, a short tagline and a small code card listing role, stack, databases and 200+ DSA problems solved.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#11173a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1000" height="360" rx="20"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .oa { animation: drift 14s ease-in-out infinite alternate; }
    .ob { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .r { opacity: 0; animation: cycle 9s infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    @keyframes drift { to { transform: translate(36px, 24px); } }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @keyframes cycle { 0% { opacity: 0; } 4%, 30% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .oa, .ob, .dot, .r { animation: none; }
      .r1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="360" fill="url(#bg)"/>
    <rect width="1000" height="360" fill="url(#dots)"/>
    <circle class="oa" cx="130" cy="40" r="230" fill="url(#glowA)"/>
    <circle class="ob" cx="880" cy="330" r="250" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <text class="m" x="60" y="88" font-size="13" letter-spacing="3" fill="#22d3ee">FULL STACK DEVELOPER</text>
  <text x="58" y="152" font-size="58" font-weight="700" letter-spacing="-1" fill="url(#name)">Ayush Pandey</text>
  <text x="60" y="192" font-size="22" fill="#cbd5e1">B.Tech Computer Science student</text>
  <text x="60" y="236" font-size="16" fill="#94a3b8">I build full-stack apps and AI-powered tools,</text>
  <text x="60" y="262" font-size="16" fill="#94a3b8">and solve DSA problems to keep my basics sharp.</text>

  <circle class="dot" cx="66" cy="309" r="4" fill="#22c55e"/>
  <text class="m" x="82" y="314" font-size="14" fill="#64748b">now:</text>
  <text class="m r r1" x="124" y="314" font-size="14" fill="#e2e8f0">learning backend architecture</text>
  <text class="m r r2" x="124" y="314" font-size="14" fill="#e2e8f0">solving DSA problems in C++</text>
  <text class="m r r3" x="124" y="314" font-size="14" fill="#e2e8f0">building AI-powered apps</text>

  <rect x="610" y="48" width="340" height="264" rx="14" fill="#0a0f1f" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="632" cy="74" r="5" fill="#ff5f57" fill-opacity="0.85"/>
  <circle cx="650" cy="74" r="5" fill="#febc2e" fill-opacity="0.85"/>
  <circle cx="668" cy="74" r="5" fill="#28c840" fill-opacity="0.85"/>
  <text class="m" x="694" y="78" font-size="12" fill="#64748b">ayush.js</text>

  <g class="m" font-size="14">
    <text x="634" y="118"><tspan fill="#c4b5fd">const</tspan> <tspan fill="#7dd3fc">ayush</tspan> <tspan fill="#94a3b8">= {</tspan></text>
    <text x="652" y="146"><tspan fill="#93c5fd">role</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#86efac">"Full Stack"</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="652" y="174"><tspan fill="#93c5fd">stack</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#86efac">"Node"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="652" y="202"><tspan fill="#93c5fd">db</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"MongoDB"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#86efac">"SQL"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="652" y="230"><tspan fill="#93c5fd">also</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"C++"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#86efac">"Python"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="652" y="258"><tspan fill="#93c5fd">dsa</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#86efac">"200+ solved"</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="634" y="286" fill="#94a3b8">};</text>
  </g>
</svg>
